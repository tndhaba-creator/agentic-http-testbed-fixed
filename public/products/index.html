<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><title>Products — Acme</title><link rel="stylesheet" href="/assets/styles.css"/></head>
<body data-page="products">
<header><div class="container"><nav><a href="/">Home</a><a href="/products">Products</a><a href="/blog">Blog</a><a href="/about">About</a><a href="/support">Support</a></nav></div></header>
<main class="container">
  <div class="card">
    <h2>Product Finder</h2>
    <form action="/api/recommend" method="post">
      <label>Budget (USD) <input type="number" name="budget" min="100" max="300" step="1" placeholder="e.g. 180" required></label>
      <label>Port Preference
        <select name="port">
          <option value="">Any</option>
          <option value="USB-C">USB-C</option>
          <option value="USB-A">USB-A</option>
          <option value="Micro-USB">Micro-USB</option>
        </select>
      </label>
      <label>Warranty Minimum
        <select name="warranty">
          <option value="">Any</option>
          <option>6-month</option>
          <option>1-year</option>
          <option>2-year</option>
          <option>3-year</option>
        </select>
      </label>
      <button type="submit">Apply Preferences</button>
      <p class="small">Hint: Submitting this form unlocks deeper product details for your session.</p>
    </form>
  </div>

  <div class="card">
    <form id="searchForm">
      <label>Search <input name="q" placeholder="widget, gizmo, budget"/></label>
      <select name="sort">
        <option value="price_asc">Price (low→high)</option>
        <option value="price_desc">Price (high→low)</option>
      </select>
      <button type="submit">Apply</button>
    </form>
  </div>
  <div id="grid" class="grid"></div>
  <div id="more" class="card"><button id="loadMore">Load more</button></div>
</main>
<footer class="container"><span class="small">© 2025 Acme Gadgets</span></footer>
<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const exp = params.get('exp');
  let page = 1, q=params.get('q')||'', sort=params.get('sort')||'price_asc';
  const grid = document.getElementById('grid');

  async function load(){
    const url = new URL('/api/products', location.origin);
    url.searchParams.set('page', page);
    url.searchParams.set('limit', 8);
    url.searchParams.set('sort', sort);
    if (q) url.searchParams.set('q', q);
    if (exp) url.searchParams.set('exp', exp);
    const res = await fetch(url);
    const data = await res.json();
    data.results.forEach(p=>{
      const a = document.createElement('a');
      a.className='card';
      a.href = '/api/product/'+p.id+(exp?('?exp='+encodeURIComponent(exp)):'')
      a.innerHTML = '<img class="product" src="'+p.img+'" alt="'+p.name+'"/>' +
                    '<div class="badge">#'+p.id+'</div>' +
                    '<h3>'+p.name+'</h3>' +
                    (p.teaser?('<p>'+p.teaser+'</p>'):'') +
                    (data.rich && p.details ? ('<p class="small">'+p.details.port+' • '+p.details.warranty+'</p>') : '') +
                    '<p class="price">$'+p.price+'</p>';
      grid.appendChild(a);
    });
    page += 1;
  }
  load();
  document.getElementById('loadMore').addEventListener('click', load);
  document.getElementById('searchForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    q = fd.get('q')||''; sort = fd.get('sort')||'price_asc'; page=1;
    grid.innerHTML = '';
    load();
  });
})();
</script>
</body>
</html>
